services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail
    ports: ["127.0.0.1:5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail"]
      interval: 5s
      retries: 10

  # Local SMTP sink for development. Replace with a real relay in production.
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # Second sink so routing can be tested locally: stands in for the self-hosted route.
  mailpit-selfhosted:
    image: axllent/mailpit
    ports: ["127.0.0.1:1026:1025", "127.0.0.1:8026:8025"]

volumes:
  pgdata:
